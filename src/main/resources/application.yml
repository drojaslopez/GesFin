spring:
  application:
    name: gesfin
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gesfin}
    username: ${SPRING_DATASOURCE_USERNAME:gesfin_user}
    password: ${SPRING_DATASOURCE_PASSWORD:gesfin_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

server:
  port: 8080